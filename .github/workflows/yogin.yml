name: Yog'in ma'lumotini yangilash

on:
  schedule:
    - cron: "30 1 * * *"   # har kuni 06:30 (Toshkent vaqti)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yogin
  cancel-in-progress: false

jobs:
  yangilash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open-Meteo dan oxirgi kunlarni olish
        run: python rain_update.py
      - name: O'zgarish bo'lsa saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rain/yogin.json rain/soatlik
          if git diff --cached --quiet; then
            echo "O'zgarish yo'q"
          else
            git commit -m "Yog'in ma'lumoti: $(date -u +%F)"
            git push
          fi
